server:
  port: 8080

spring:
  application:
    name: spring-ai-chat-agent
  
  # Database Configuration
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/spring_ai_chat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  # Spring AI Configuration
  ai:
    # OpenAI Configuration
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4
          temperature: 0.7
          max-tokens: 4096
      embedding:
        options:
          model: text-embedding-ada-002
    
    # Azure OpenAI Configuration
    azure:
      openai:
        api-key: ${AZURE_OPENAI_API_KEY:}
        endpoint: ${AZURE_OPENAI_ENDPOINT:}
        chat:
          options:
            deployment-name: ${AZURE_OPENAI_DEPLOYMENT:gpt-4}
            temperature: 0.7
    
    # Anthropic Claude Configuration
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-3-sonnet-20240229
          temperature: 0.7
          max-tokens: 4096
    
    # Vector Store Configuration (for long-term memory)
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

# Application Custom Configuration
app:
  # Default AI provider: openai, azure, anthropic, gemini
  default-provider: ${DEFAULT_AI_PROVIDER:openai}
  
  # Memory Configuration
  memory:
    # Short-term memory: number of recent messages to keep in context
    short-term-size: ${MEMORY_SHORT_TERM_SIZE:10}
    # Long-term memory: similarity threshold for retrieval
    long-term-threshold: ${MEMORY_LONG_TERM_THRESHOLD:0.7}
    # Maximum number of memories to retrieve
    long-term-max-results: ${MEMORY_LONG_TERM_MAX:5}
  
  # CORS Configuration
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging
logging:
  level:
    com.example.chatbot: DEBUG
    org.springframework.ai: DEBUG
